<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aprova Estudos — Seu Espaço de Estudos</title>
  <meta name="description" content="Organize sua rotina de estudos com cronograma de 44 semanas, revisão com quiz e flashcards, simulados comentados, cronômetro Chronos, redação e caderno de erros." />
  <meta property="og:title" content="Aprova Estudos — Seu Espaço de Estudos" />
  <meta property="og:description" content="Cronograma de 44 semanas, quiz e flashcards por aula, simulados comentados, cronômetro de foco Chronos, redação e caderno de erros." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="theme-color" content="#141311" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23247A56'/%3E%3Cpath d='M32 15L10 26l22 11 22-11-22-11Z' fill='none' stroke='%23F4EFE6' stroke-width='4.2' stroke-linejoin='round'/%3E%3Cpath d='M19 31.5v11.5c0 4 5.8 7.5 13 7.5s13-3.5 13-7.5V31.5' fill='none' stroke='%23F4EFE6' stroke-width='4.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#141311;color:#F4EFE6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;overflow:hidden}
    .ld-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;animation:ldIn .45s cubic-bezier(.22,1,.36,1) both}
    .ld-orb{width:56px;height:56px;border-radius:15px;background:#247A56;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -10px rgba(0,0,0,.6)}
    .ld-title{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:20px;letter-spacing:-.02em;color:#F4EFE6}
    .ld-sub{font-size:12.5px;color:#A69E90;margin-top:-8px}
    .ld-track{width:168px;height:3px;border-radius:99px;background:#27241F;overflow:hidden;position:relative}
    .ld-bar{position:absolute;inset:0 auto 0 0;width:44%;border-radius:99px;background:#2E9B6C;animation:ldSlide 1.2s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes ldIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <div id="ld" class="ld-wrap" role="status" aria-live="polite">
    <div class="ld-orb" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F4EFE6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 8l10 5 10-5-10-5Z"/><path d="M6 10.5v5.5c0 1.8 2.7 3.5 6 3.5s6-1.7 6-3.5v-5.5"/></svg>
    </div>
    <div class="ld-title">Aprova Estudos</div>
    <div class="ld-sub">Abrindo sua mesa de estudos...</div>
    <div class="ld-track" aria-hidden="true"><div class="ld-bar"></div></div>
  </div>
  <script>
    (async () => {
      try {
        const v = '30';
        const parts = await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt'].map(f =>
          fetch('./' + f + '?v=' + v).then(r => { if (!r.ok) throw new Error(f + ' não encontrado'); return r.text(); })
        ));
        const b64 = parts.map(t => t.replace(/\s+/g, '')).join('');
        const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const ds = new DecompressionStream('gzip');
        const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById('ld').innerHTML = '<div style="max-width:340px;padding:16px"><strong>Não foi possível abrir a página</strong><p style="color:#A69E90;font-size:13px">' + err.message + '</p></div>';
      }
    })();
  </script>
</body>
</html>
