<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início - StudyBlox (Ensino Médio 2° e 3° Ano)</title>
  <meta name="theme-color" content="#191B1D" />
  <style>
    body{margin:0;background:#191B1D;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
    .spin{width:34px;height:34px;border:4px solid #393B3D;border-top-color:#00B06F;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="ld"><div class="spin"></div><div style="font-weight:700">Carregando StudyBlox...</div></div>
  <script>
    (async () => {
      try {
        const parts = await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt'].map(f =>
          fetch('./' + f + '?v=1').then(r => { if (!r.ok) throw new Error(f + ' não encontrado'); return r.text(); })
        ));
        const b64 = parts.map(t => t.replace(/\s+/g, '')).join('');
        const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const ds = new DecompressionStream('gzip');
        const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById('ld').innerHTML = '<div style="max-width:340px;padding:16px"><strong>Faltou algum arquivo (p1.txt a p4.txt)</strong><p style="color:#BDBEC0;font-size:13px">' + err.message + '</p></div>';
      }
    })();
  </script>
</body>
</html>
