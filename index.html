<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aprova Estudos — Plataforma Completa de Estudos</title>
  <meta name="description" content="Plataforma completa e gratuita para todos os tipos de estudo: Mapa de Ciclos, cronograma de 44 semanas, Revisão Ativa com IA (Quiz e Flashcards 3D), Simulados interativos automáticos, Chronos, redação e caderno de erros." />
  <meta property="og:title" content="Aprova Estudos — Plataforma Completa de Estudos" />
  <meta property="og:description" content="Organize sua rotina de estudos com Mapa de Ciclos, Quiz e Flashcards interativos com IA, Simulados automáticos, Chronos e Caderno de Erros inteligente." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="theme-color" content="#0B101B" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2310B981'/%3E%3Cstop offset='1' stop-color='%230EA5E9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 15L10 26l22 11 22-11-22-11Z' fill='none' stroke='%23fff' stroke-width='4.2' stroke-linejoin='round'/%3E%3Cpath d='M19 31.5v11.5c0 4 5.8 7.5 13 7.5s13-3.5 13-7.5V31.5' fill='none' stroke='%23fff' stroke-width='4.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0B101B;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;overflow:hidden}
    .ld-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;animation:ldIn .45s cubic-bezier(.22,1,.36,1) both}
    .ld-orb{position:relative;width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,#10B981 0%,#0EA5E9 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(16,185,129,.28);animation:ldFloat 1.9s ease-in-out infinite}
    .ld-orb::after{content:"";position:absolute;inset:-6px;border-radius:21px;border:2px solid rgba(16,185,129,.3);animation:ldPulse 1.9s cubic-bezier(0,0,.2,1) infinite}
    .ld-title{font-weight:800;font-size:18px;letter-spacing:-.02em}
    .ld-sub{font-size:12px;color:#94A3B8;margin-top:-8px}
    .ld-track{width:176px;height:4px;border-radius:99px;background:#192338;overflow:hidden;position:relative}
    .ld-bar{position:absolute;inset:0 auto 0 0;width:46%;border-radius:99px;background:linear-gradient(90deg,#10B981,#0EA5E9);animation:ldSlide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes ldIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes ldFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes ldPulse{0%{transform:scale(.96);opacity:.75}100%{transform:scale(1.22);opacity:0}}
    @keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <div id="ld" class="ld-wrap" role="status" aria-live="polite">
    <div class="ld-orb" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 8l10 5 10-5-10-5Z"/><path d="M6 10.5v5.5c0 1.8 2.7 3.5 6 3.5s6-1.7 6-3.5v-5.5"/></svg>
    </div>
    <div class="ld-title">Aprova Estudos</div>
    <div class="ld-sub">Carregando Mapa de Ciclos e Rotina...</div>
    <div class="ld-track" aria-hidden="true"><div class="ld-bar"></div></div>
  </div>
  <script>
    (async () => {
      try {
        const v = '25';
        const parts = await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt'].map(f =>
          fetch('./' + f + '?v=' + v).then(r => { if (!r.ok) throw new Error(f + ' não encontrado'); return r.text(); })
        ));
        const b64 = parts.map(t => t.replace(/\s+/g, '')).join('');
        const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const ds = new DecompressionStream('gzip');
        const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById('ld').innerHTML = '<div style="max-width:340px;padding:16px"><strong>Erro ao carregar os arquivos da plataforma</strong><p style="color:#94A3B8;font-size:13px">' + err.message + '</p></div>';
      }
    })();
  </script>
</body>
</html>
